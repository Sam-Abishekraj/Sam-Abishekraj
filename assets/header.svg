<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Sam Abishekraj D: AI Engineer and Forward Deployed Engineer</title>
  <desc id="d">I wire LLM agents into real business systems and make them safe, observable and cheap to run.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="38%" r="55%">
      <stop offset="0" stop-color="#3f3fbf" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3f3fbf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#04040c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#a3dcec"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a3dcec" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="20"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .node{fill:#0b0c1c;stroke:#a3dcec;stroke-opacity:.35}
      .lbl{fill:#bab9c1;font-size:13px;letter-spacing:1.5px}
      .wire{stroke:#a3dcec;stroke-opacity:.28;stroke-width:1.5;fill:none}
      .pulse{fill:#a3dcec}
      @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
      .b1{animation:blink 2.4s ease-in-out infinite}
      .b2{animation:blink 2.4s ease-in-out .5s infinite}
      .b3{animation:blink 2.4s ease-in-out 1s infinite}
      .b4{animation:blink 2.4s ease-in-out 1.5s infinite}
      .b5{animation:blink 2.4s ease-in-out 2s infinite}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#04040c"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- left: marquee type -->
    <text x="64" y="92" class="mono" font-size="15" letter-spacing="3" fill="#a3dcec">AI ENGINEER  ·  FORWARD DEPLOYED ENGINEER</text>
    <text x="60" y="178" class="sans" font-size="76" font-weight="600" letter-spacing="-2" fill="url(#name)">Sam Abishekraj D</text>
    <text x="64" y="232" class="sans" font-size="23" fill="#d7d8de">I wire LLM agents into real business systems,</text>
    <text x="64" y="264" class="sans" font-size="23" fill="#d7d8de">and make them safe, observable and cheap to run.</text>
    <line x1="64" y1="312" x2="134" y2="312" stroke="#a3dcec" stroke-width="2"/>
    <text x="64" y="346" class="sans" font-size="16" fill="#8fa9b0">Madurai, India  ·  Open to AI Engineer / FDE roles</text>

    <!-- right: agent wired into client systems -->
    <g transform="translate(1012 200)">
      <path class="wire" d="M0 0 L-128 -118"/>
      <path class="wire" d="M0 0 L128 -118"/>
      <path class="wire" d="M0 0 L-160 20"/>
      <path class="wire" d="M0 0 L160 20"/>
      <path class="wire" d="M0 0 L0 132"/>
      <circle class="pulse b1" cx="-64" cy="-59" r="3"/>
      <circle class="pulse b2" cx="64" cy="-59" r="3"/>
      <circle class="pulse b3" cx="-80" cy="10" r="3"/>
      <circle class="pulse b4" cx="80" cy="10" r="3"/>
      <circle class="pulse b5" cx="0" cy="66" r="3"/>

      <rect class="node" x="-176" y="-140" width="96" height="40" rx="8"/>
      <text class="mono lbl" x="-128" y="-115" text-anchor="middle">CRM</text>
      <rect class="node" x="80" y="-140" width="96" height="40" rx="8"/>
      <text class="mono lbl" x="128" y="-115" text-anchor="middle">SQL</text>
      <rect class="node" x="-208" y="0" width="96" height="40" rx="8"/>
      <text class="mono lbl" x="-160" y="25" text-anchor="middle">RAG</text>
      <rect class="node" x="112" y="0" width="96" height="40" rx="8"/>
      <text class="mono lbl" x="160" y="25" text-anchor="middle">NOTIFY</text>
      <rect class="node" x="-48" y="112" width="96" height="40" rx="8"/>
      <text class="mono lbl" x="0" y="137" text-anchor="middle">MCP</text>

      <circle r="46" fill="#3f3fbf" fill-opacity=".18" stroke="#a3dcec" stroke-opacity=".6"/>
      <circle r="30" fill="#0b0c1c" stroke="#a3dcec" stroke-width="1.5"/>
      <text class="mono" y="5" text-anchor="middle" font-size="13" letter-spacing="1.5" fill="#a3dcec">AGENT</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="20" fill="none" stroke="#a3dcec" stroke-opacity=".12"/>
</svg>
